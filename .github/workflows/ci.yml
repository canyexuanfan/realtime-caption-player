# D5: CI — windows-latest 上 configure + 构建 + ctest（仅 rcp_core + 单元测试）。
#
# 注意（2026-10-18 修复）：
#   - 原 windows-msvc-ci 预设硬编码 "Visual Studio 17 2022" 生成器，而 windows-latest
#     镜像已升级为 windows-2025-vs2026（无 VS2022 实例），所有 push 的 CI 均在
#     configure 阶段 3 秒失败。现改用 Ninja 生成器 + msvc-dev-cmd 提供的 MSVC 环境，
#     与沙箱本地（windows-ninja-release）一致，对 runner 镜像升级鲁棒。
#   - runner 预装 Qt 为空，需 install-qt-action 安装 6.8.1（与工作区 .qt6 同版本）；
#     CMAKE_PREFIX_PATH 由该 action 自动注入。
#   - QSQLITE 运行时插件由 tests/CMakeLists.txt 的 POST_BUILD 自动拷贝到测试目录。
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.8.1 (msvc2022_64)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.1"
          arch: win64_msvc2022_64
          cache: true

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (Ninja Release, core+tests)
        run: cmake --preset windows-ninja-ci

      - name: Build
        run: cmake --build out/build/windows-ninja-ci

      - name: Test
        run: ctest --test-dir out/build/windows-ninja-ci --output-on-failure
